<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; background:#f5f7fb;}
        .login-box {background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
        input {width:100%; padding:0.5rem; margin-bottom:1rem;}
        button {padding:0.5rem 1rem;}
        .error {color:red; margin-bottom:1rem;}
    </style>
</head>
<body>
    <form class="login-box" method="POST">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
